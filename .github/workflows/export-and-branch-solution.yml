name: export-and-branch-solution

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: 'Solution name'
        required: true
        default: OpsPulse

env:
  SOLUTION_NAME: OpsPulse
  DEV_ENVIRONMENT_URL: https://orgf4581915.crm3.dynamics.com

jobs:
  export-from-dev:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Install Power Platform Tools
      uses: microsoft/powerplatform-actions/actions-install@v1

    - name: Who am I
      uses: microsoft/powerplatform-actions/who-am-i@v1
      with:
        environment-url: ${{ env.DEV_ENVIRONMENT_URL }}
        app-id: ${{ secrets.PP_APP_ID }}
        client-secret: ${{ secrets.PP_CLIENT_SECRET }}
        tenant-id: ${{ secrets.PP_TENANT_ID }}

    - name: Export solution (unmanaged)
      uses: microsoft/powerplatform-actions/export-solution@v1
      with:
        environment-url: ${{ env.DEV_ENVIRONMENT_URL }}
        app-id: ${{ secrets.PP_APP_ID }}
        client-secret: ${{ secrets.PP_CLIENT_SECRET }}
        tenant-id: ${{ secrets.PP_TENANT_ID }}
        solution-name: ${{ env.SOLUTION_NAME }}
        solution-output-file: out/exported/${{ env.SOLUTION_NAME }}.zip

    - name: Unpack solution into files
      uses: microsoft/powerplatform-actions/unpack-solution@v1
      with:
        solution-file: out/exported/${{ env.SOLUTION_NAME }}.zip
        solution-folder: out/solutions/${{ env.SOLUTION_NAME }}
        solution-type: 'Unmanaged'
        overwrite-files: true

    - name: Branch it for a pull request
      uses: microsoft/powerplatform-actions/branch-solution@v1
      with:
        solution-folder: out/solutions/${{ env.SOLUTION_NAME }}
        solution-target-folder: solutions/${{ env.SOLUTION_NAME }}
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        allow-empty-commit: true
